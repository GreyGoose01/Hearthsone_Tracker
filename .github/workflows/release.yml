# Builds the .deb and attaches it to a GitHub release.
# Start it with "Run workflow" in the Actions tab (it tags v<version> itself),
# or push a tag like v0.2.1.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q

      - name: Version and tag
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hearthwatch/__init__.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build AutoTavern's simulator
        run: packaging/build-autotavern.sh dist/autotavern

      - name: Build .deb
        run: AUTOTAVERN_DIR=dist/autotavern packaging/build-deb.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/hearthwatch_*.deb \
            --target "$GITHUB_SHA" \
            --title "Hearthwatch ${TAG#v}" \
            --generate-notes
